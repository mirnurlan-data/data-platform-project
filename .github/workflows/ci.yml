name: Data Platform CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic sales
        run: python scripts/generate_sales.py
      - name: Build analytical warehouse
        run: python scripts/run_etl.py
      - name: Reconcile and check data quality
        run: python scripts/validate_warehouse.py
      - uses: actions/upload-artifact@v4
        with:
          name: warehouse-quality-report
          path: output/quality_report.json
