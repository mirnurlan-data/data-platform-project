name: Cloud Data Platform CI
on:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-ci.yml"
      - "scripts/generate_sales.py"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-ci.yml"
      - "scripts/generate_sales.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_DSN: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio
      DBT_PG_HOST: 127.0.0.1
      DBT_PG_PORT: "5432"
      DBT_PG_USER: portfolio
      DBT_PG_PASSWORD: portfolio
      DBT_PG_DB: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cloud lab tools
        run: python -m pip install -r cloud/requirements-ci.txt
      - name: Run contract and PostgreSQL rollback tests
        run: python -m unittest discover -s cloud/tests -v
      - name: Generate only synthetic sample data
        run: python scripts/generate_sales.py
      - name: Validate input contract
        run: python -m cloud.cloud_pipeline.cli validate --file data/synthetic_sales.csv
      - name: Initial and idempotent PostgreSQL loads
        run: |
          python -m cloud.cloud_pipeline.cli load --file data/synthetic_sales.csv
          python -m cloud.cloud_pipeline.cli load --file data/synthetic_sales.csv
      - name: Build dbt dimensional models and run tests
        run: dbt build --project-dir cloud/dbt --profiles-dir cloud/dbt --target ci
      - name: Check source-to-warehouse record reconciliation
        run: |
          mkdir -p cloud/results
          python -m cloud.cloud_pipeline.cli verify --file data/synthetic_sales.csv > cloud/results/verification.json
          cat cloud/results/verification.json
      - name: Upload non-sensitive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-cloud-platform-quality
          path: cloud/results/verification.json
          if-no-files-found: ignore
